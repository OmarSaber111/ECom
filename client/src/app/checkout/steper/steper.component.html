
<mat-stepper [linear]="true" #stepper>
    <mat-step [stepControl]="Address">
      <ng-template matStepLabel>Fill out your Address</ng-template>
      <app-address [address]="Address"></app-address>
    </mat-step>

    <mat-step [stepControl]="DeliveryMethod " label="Delivery Method">
        <app-delivery [deliveryMethods]="DeliveryMethod"></app-delivery>
    
    </mat-step>
    <mat-step>
        <ng-template matStepLabel>Done</ng-template>
        <p>You are now done.</p>
        <div>
          <app-payment [address]="Address" [delivery]="DeliveryMethod"></app-payment>

        </div>
    </mat-step>
</mat-stepper>
