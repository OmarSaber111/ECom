<div class="d-flex justify-content-between">
<button mat-raised-button (click)="updateAddress()">Save Change</button>
<button mat-raised-button ngClass="{'btn-success': canEdit===true, 'btn-danger': canEdit===false}" (click)="canEdit = !canEdit">
    {{ canEdit ? 'Disable Edit' : 'Enable Edit' }}

</button>
</div>
<form [formGroup]="address">
            

           
            <mat-form-field>
                <mat-label>First Name</mat-label>
                <input matInput placeholder="First name" [readonly]="!canEdit" formControlName="firstName" required>
            </mat-form-field>

            <mat-form-field>
                <mat-label>Last Name</mat-label>
                <input matInput placeholder="Last name" [readonly]="!canEdit" formControlName="lastName" required>
            </mat-form-field>

            <mat-form-field>
                <mat-label>Street</mat-label>
                <input matInput placeholder="Street" [readonly]="!canEdit" formControlName="street" required>
            </mat-form-field>
            <mat-form-field>
                <mat-label>City</mat-label>
                <input matInput placeholder="City" [readonly]="!canEdit" formControlName="city" required>

            </mat-form-field>
            <mat-form-field>
                <mat-label>Zip Code</mat-label>
                <input matInput placeholder="Zip Code" [readonly]="!canEdit" formControlName="zipCode" required>
            </mat-form-field>
            <mat-form-field>
                <mat-label>State</mat-label>
                <input matInput placeholder="State" [readonly]="!canEdit" formControlName="state" required>
            </mat-form-field>
            <div>
                <button  mat-flat-button matStepperNext>Next</button>
            </div>
        </form>
