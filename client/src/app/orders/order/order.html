<div class="container mt-5">
    <div class="row">
        <div class="col-12">
            <div class="table-container">
                <table class="table table-hover custom-table">
                    <thead>
                        <tr>
                            <th>Order</th>
                            <th>Imag</th>
                            <th>Date</th>
                            <th>Status</th>
                            <th>Total</th>
                            <th>Details</th>
                        </tr>
                    </thead>
                    <tbody>
                        @for (order of orders; track $index) {
                        <tr>
                            <th routerLink="/orders/item" [queryParams]="{id:order.id}">#{{order.id}}</th>
                            <td>
                               <div class="img-container">
                                  <img src="https://localhost:44375/{{getfirstimageorderitem(order.orderItems)}}" class="order-image img-fluid" alt="">
                                  @if(order.orderItems.length > 1){
                                      <span class="more-image">{{order.orderItems.length-1}}</span>
                                  }
                               </div>
                            </td>
                            <td>{{order.orderDate | date:'medium'}}</td>
                            <td>{{order.status}}</td>
                            <td>{{order.total | currency}}</td>
                            <td>
                                <button class="btn btn-info"
                                    routerLink="/orders/item" [queryParams]="{id:order.id}">
                                    <i class="fa fa-info"></i>
                                </button>
                            </td>
                        </tr>
                        }
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
